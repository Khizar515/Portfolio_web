version: '3.9'
services:
  database:
    build: ./database
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - portfolio_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    container_name: portfolio_backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 5000
    volumes:
      - uploads_data:/app/uploads
      - database_exports:/app/exports
    ports:
      # Bound to 127.0.0.1 — reachable by the Cloudflare tunnel but NOT exposed on the public IP
      - "127.0.0.1:5000:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - portfolio_net

  frontend:
    build:
      context: ./frontend
      args:
        # /api is relative — browser calls khizar.ksdev.me/api/* which Next.js rewrites proxy to backend
        NEXT_PUBLIC_API_URL: /api
        # Docker-internal address the Next.js SERVER uses to reach backend for rewrites
        INTERNAL_API_URL: http://backend:5000
    container_name: portfolio_frontend
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 — reachable by the Cloudflare tunnel but NOT exposed on the public IP
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - portfolio_net

volumes:
  mysql_data:
  uploads_data:
  database_exports:

networks:
  portfolio_net:
    driver: bridge
