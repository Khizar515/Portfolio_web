version: '3.9'
services:
  database:
    build: ./database
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - portfolio_net

  backend:
    build: ./backend
    container_name: portfolio_backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 5000
    volumes:
      - uploads_data:/app/uploads
      - database_exports:/app/exports # For DB exports
    ports:
      - "5000:5000"
    depends_on:
      - database
    networks:
      - portfolio_net

  frontend:
    build: ./frontend
    container_name: portfolio_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - portfolio_net

volumes:
  mysql_data:
  uploads_data:
  database_exports:

networks:
  portfolio_net:
    driver: bridge
